[project]
name = "negotiator"
version = "0.1.0"
description = "Dials into a meeting by phone and coaches you privately during a negotiation."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.8,<3",
    "twilio>=9.13,<10",
    "websockets>=17,<18",
    "fastapi>=0.162",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7,<3",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
negotiator = "negotiator.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["negotiator*"]

[tool.setuptools.package-data]
negotiator = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
